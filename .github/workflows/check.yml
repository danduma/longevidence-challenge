name: Check website and API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s site/api -p 'test_*.py'
      - run: python -m compileall -q site/api
      - run: python -m unittest discover -s standalone -v
      - run: python -m compileall -q standalone
  thermal-benchmark:
    name: Thermal benchmark (numerical checks only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/cryopreservation/requirements.txt
      - run: python research/cryopreservation/reproduce.py
      - uses: actions/upload-artifact@v4
        with:
          name: thermal-benchmark-results
          path: research/cryopreservation/results/*.json
